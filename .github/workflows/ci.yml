name: Cross-Platform Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build trên ${{ matrix.os-name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os-name: macOS (Apple Silicon M-Series)
            artifact_name: dev_utility_hub-macos-arm64
            binary_path: target/release/dev_utility_hub
            release_asset: dev_utility_hub-macos-arm64
          - os: windows-latest
            os-name: Windows (x64)
            artifact_name: dev_utility_hub-windows-x64
            binary_path: target/release/dev_utility_hub.exe
            release_asset: dev_utility_hub-windows-x64.exe
          - os: ubuntu-latest
            os-name: Linux (Ubuntu x64)
            artifact_name: dev_utility_hub-linux-x64
            binary_path: target/release/dev_utility_hub
            release_asset: dev_utility_hub-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Kiểm tra mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt thư viện đồ họa (chỉ Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Cài đặt Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Chạy unit & integration tests
        run: cargo test --verbose

      - name: Biên dịch bản Release tối ưu
        run: cargo build --release

      - name: Chuẩn bị file phát hành
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary_path }}" "dist/${{ matrix.release_asset }}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.release_asset }}
          if-no-files-found: error

  publish-release:
    name: Tự động phát hành GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Tải toàn bộ artifacts đã build
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Xác định tag và tiêu đề Release
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "title=Release ${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "title=DevUtility Hub (Latest Build)" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Xuất bản lên GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          prerelease: ${{ steps.release_meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
